# Security scans. This repository is public, so GitHub's own secret scanning and CodeQL (default setup) run on it too;
# this workflow adds the same free tools as the private repositories. Identical in every dxcufgb repository except
# this first sentence and the Dependencies job (per language).
# The three job names "Secrets (gitleaks)", "Code (Semgrep)" and "Dependencies" are required status checks: keep them.
#   - Secrets (gitleaks): the whole history of the checked-out commit (only HEAD's history: other branches are
#     fetched too, but a finding there must not fail this run), with a pinned gitleaks release binary whose SHA-256
#     is hard-coded below and which must first detect a token generated at run time (with the repository's gitleaks
#     configuration). Merge commits are scanned against their first parent. Output is redacted. A true
#     false positive (a fake token in a test) goes into .gitleaks.toml as a narrow allowlist entry with a comment;
#     the job fails unless that file has [extend] useDefault = true, which keeps the default rules on.
#   - Code (Semgrep): the Semgrep registry rules listed in the scan step (r/bash: every bash rule, there is no bash
#     ruleset), rules of severity WARNING and ERROR. INFO rules are style and best-practice hints, too noisy for a
#     blocking check. Fix a finding, or mark a false positive with an inline "nosemgrep: <rule-id>" comment and a
#     reason; .semgrepignore is only for vendored or generated files.
#   - Dependencies: known vulnerabilities in the pinned dependencies (see the job).
# Findings show up as annotations on the pull request. The weekly run catches new advisories and new rules for code
# that has not changed. How to run the three checks locally: README, Development.
# Updating a tool: change its version below; for gitleaks also GITLEAKS_SHA256, the sha256 of
# gitleaks_<version>_linux_x64.tar.gz from that release's gitleaks_<version>_checksums.txt.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:23 UTC
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SEMGREP_VERSION: "1.180.0"

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, not just the last commit
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $dir/$archive" | sha256sum --check --strict -
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"

      # A .gitleaks.toml without [extend] useDefault = true replaces the default rules, which would silently turn
      # most of the scan off.
      - name: Check .gitleaks.toml
        run: |
          if [ ! -e .gitleaks.toml ]; then
            echo "No .gitleaks.toml: default rules."
            exit 0
          fi
          python3 -c 'import sys, tomllib; c = tomllib.load(open(".gitleaks.toml", "rb")); sys.exit(0 if c.get("extend", {}).get("useDefault") is True else 1)' || {
            echo "::error file=.gitleaks.toml,title=gitleaks config::.gitleaks.toml must extend the default rules: add [extend] with useDefault = true"
            exit 1
          }
          echo ".gitleaks.toml extends the default rules."

      # Proves the pinned binary still catches a secret with the configuration the scan uses (the repository's
      # .gitleaks.toml when present, so an allowlist or disabled rule that swallows everything fails here). The token
      # is assembled at run time in a temporary folder, so no secret-shaped literal is ever committed.
      - name: Self-test (gitleaks must detect a generated token)
        run: |
          config=()
          if [ -e .gitleaks.toml ]; then
            config=(--config "$PWD/.gitleaks.toml")
          fi
          dir="$(mktemp -d)"
          random="$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 36)"
          printf 'token = "%s%s_%s"\n' "gh" "p" "$random" > "$dir/settings.txt"
          report="$RUNNER_TEMP/gitleaks-self-test.json"
          gitleaks dir "${config[@]}" --redact --no-banner --exit-code 0 --report-format json --report-path "$report" "$dir"
          rm -rf "$dir"
          if [ "$(jq '[.[] | select(.RuleID == "github-pat")] | length' "$report")" -lt 1 ]; then
            echo "::error title=gitleaks self-test::gitleaks did not detect a generated GitHub token; the scan cannot be trusted"
            exit 1
          fi
          echo "Self-test passed: the generated token was detected."

      - name: Scan the git history
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          # .gitleaks.toml in the repository root is picked up automatically when present. Without --log-opts gitleaks
          # scans every ref (git log --all); these are its default options with HEAD instead, plus each merge commit's
          # diff against its first parent (git log -p shows no patch for merges, so a secret added while resolving a
          # merge would be missed; changes merged from a branch may be reported twice).
          if gitleaks git --redact --no-banner --exit-code 1 --report-format json --report-path "$report" \
            --log-opts="--full-history --diff-filter=tuxdb --diff-merges=first-parent HEAD" .; then
            exit 0
          fi
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks \(.RuleID)::Possible secret (\(.RuleID)) in commit \(.Commit[0:12]); remove and rotate it, or allowlist a false positive in .gitleaks.toml"' "$report" || true
          exit 1

  code:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check --no-cache-dir --quiet "semgrep==${SEMGREP_VERSION}"
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      - name: Scan the code
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          report="$RUNNER_TEMP/semgrep.json"
          status=0
          semgrep scan --metrics=off --disable-version-check --error \
            --severity WARNING --severity ERROR \
            --config p/python --config p/javascript --config p/security-audit \
            --config p/secrets --config p/github-actions --config r/bash \
            --json-output="$report" || status=$?
          # GitHub shows only the first few annotations of a step; this one lists every finding
          jq -r 'select(.results | length > 0) | "::error title=Semgrep: \(.results | length) finding(s)::" + ([.results[] | "\(.check_id) \(.path):\(.start.line)"] | join(" ; "))' "$report" || true
          jq -r '.results[] | "::error file=\(.path),line=\(.start.line),endLine=\(.end.line),title=\(.check_id)::\(.extra.message | gsub("[\r\n%]"; " "))"' "$report" || true
          exit "$status"

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Exactly the versions in package-lock.json; no install scripts (nothing needs to be built for an audit).
      - name: Install from package-lock.json
        run: npm ci --ignore-scripts --no-audit --no-fund

      # discord.js and everything it pulls in run inside the bot, next to the Discord token: any known vulnerability
      # fails. There are no development dependencies (the tests use node:test), so nothing else to audit.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
