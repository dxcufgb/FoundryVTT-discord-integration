# Runs on every push and pull request:
#   - unit tests on Linux and Windows, Node 20 and 22
#   - the Linux installer end to end (non-interactive, real systemd unit, auto-update from the
#     latest GitHub release through the real systemd units, then uninstall)
#   - the Windows installer: compiled with Inno Setup, installed silently with auto-update on,
#     updated to the latest GitHub release by auto-update.ps1, checked, uninstalled
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Entry point and scripts parse
        run: node --check src/index.js && node --check scripts/register-commands.js && node --check scripts/check-config.js && node --check scripts/self-update.js

  linux-installer:
    name: Linux installer (systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Shell syntax and shellcheck
        run: |
          bash -n deploy/linux/install.sh && bash -n deploy/linux/auto-update.sh
          shellcheck --version
          shellcheck -f gcc deploy/linux/*.sh | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=\1,line=\2,col=\3::\4/'
          shellcheck deploy/linux/*.sh
      - name: Fake Foundry data folder
        run: |
          mkdir -p "$HOME/foundrydata/Data/modules/lib-wrapper" "$HOME/foundrydata/Data/systems/dnd5e" "$HOME/foundrydata/Config"
          echo '{"id":"lib-wrapper","title":"libWrapper","version":"1.0.0"}' > "$HOME/foundrydata/Data/modules/lib-wrapper/module.json"
          echo '{"id":"dnd5e","title":"D&D 5e","version":"5.0.0"}' > "$HOME/foundrydata/Data/systems/dnd5e/system.json"
          echo '{"port":30000}' > "$HOME/foundrydata/Config/options.json"
      - name: Install non-interactively
        run: |
          sudo env "PATH=$PATH" ./deploy/linux/install.sh --non-interactive --no-start \
            --token dummy-token --client-id 123456789012345678 --guild-id 987654321098765432 \
            --dir /opt/foundryvtt-discord-integration --user "$USER" --data-path "$HOME/foundrydata" \
            --timezone Europe/Stockholm --interval 15
      - name: Verify
        run: |
          set -x
          test -f /opt/foundryvtt-discord-integration/.env
          sudo grep -q '^DISCORD_CLIENT_ID=123456789012345678$' /opt/foundryvtt-discord-integration/.env
          sudo grep -q "^FOUNDRY_DATA_PATH=$HOME/foundrydata$" /opt/foundryvtt-discord-integration/.env
          sudo grep -q '^TIMEZONE=Europe/Stockholm$' /opt/foundryvtt-discord-integration/.env
          sudo grep -q '^POLL_INTERVAL_SECONDS=15$' /opt/foundryvtt-discord-integration/.env
          test "$(sudo stat -c %a /opt/foundryvtt-discord-integration/.env)" = "600"
          test -d /opt/foundryvtt-discord-integration/node_modules/discord.js
          systemctl is-enabled foundryvtt-discord-bot
          grep -q "^User=$USER$" /etc/systemd/system/foundryvtt-discord-bot.service
          # The service starts (and then fails on the dummy token, which is the expected outcome without Discord).
          sudo systemctl start foundryvtt-discord-bot || true
          sleep 5
          sudo journalctl -u foundryvtt-discord-bot --no-pager | tail -n 20
          sudo journalctl -u foundryvtt-discord-bot --no-pager | grep -q 'Foundry VTT Discord integration starting'
      - name: Re-run as an upgrade (keeps the configuration)
        run: |
          sudo env "PATH=$PATH" ./deploy/linux/install.sh --non-interactive --no-start --dir /opt/foundryvtt-discord-integration --user "$USER"
          sudo grep -q '^DISCORD_GUILD_ID=987654321098765432$' /opt/foundryvtt-discord-integration/.env
      - name: Re-run interactively on a pseudo-terminal, accepting every default
        # Regression test: answering the hidden token prompt with Enter must keep the stored token, not end the script.
        run: |
          printf '\n\n\n\n\n\n\n\n\n\n\n\n\n\n' | sudo env "PATH=$PATH" script -qefc "./deploy/linux/install.sh --no-start --dir /opt/foundryvtt-discord-integration" /dev/null
          sudo grep -q '^DISCORD_TOKEN=dummy-token$' /opt/foundryvtt-discord-integration/.env
          sudo grep -q '^DISCORD_CLIENT_ID=123456789012345678$' /opt/foundryvtt-discord-integration/.env
          sudo grep -q '^TIMEZONE=Europe/Stockholm$' /opt/foundryvtt-discord-integration/.env
      - name: Auto-update is off by default, can be turned on, and survives an upgrade
        run: |
          set -x
          if systemctl is-enabled foundryvtt-discord-bot-update.timer; then echo "auto-update must be off by default"; exit 1; fi
          sudo ./deploy/linux/install.sh --enable-auto-update --dir /opt/foundryvtt-discord-integration
          systemctl is-enabled foundryvtt-discord-bot-update.timer
          systemctl list-timers foundryvtt-discord-bot-update.timer --no-pager
          sudo env "PATH=$PATH" ./deploy/linux/install.sh --non-interactive --no-start --dir /opt/foundryvtt-discord-integration
          systemctl is-enabled foundryvtt-discord-bot-update.timer
      - name: Auto-update to the latest release through the real systemd service
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -x
          D=/opt/foundryvtt-discord-integration
          sudo install -d -m 700 /etc/foundryvtt-discord-integration
          printf '%s\n' "$GITHUB_TOKEN" | sudo tee /etc/foundryvtt-discord-integration/github-token >/dev/null
          sudo chmod 600 /etc/foundryvtt-discord-integration/github-token
          sudo systemctl stop foundryvtt-discord-bot
          echo "EXTRA_SETTING=kept" | sudo tee -a "$D/.env" >/dev/null
          echo marker | sudo tee "$D/data/marker" >/dev/null
          BEFORE="$(sudo sha256sum "$D/.env")"
          sudo "$D/deploy/linux/auto-update.sh" --check
          sudo systemctl start foundryvtt-discord-bot-update.service || { sudo journalctl -u foundryvtt-discord-bot-update --no-pager | tail -n 60; exit 1; }
          sudo journalctl -u foundryvtt-discord-bot-update --no-pager | tail -n 30
          sudo journalctl -u foundryvtt-discord-bot-update --no-pager | grep -q 'Updated to version'
          if sudo journalctl -u foundryvtt-discord-bot-update --no-pager | grep -qF "$GITHUB_TOKEN"; then echo "the token was logged"; exit 1; fi
          test "$(sudo sha256sum "$D/.env")" = "$BEFORE"
          test "$(sudo stat -c %a "$D/.env")" = "600"
          sudo grep -q '^marker$' "$D/data/marker"
          if grep -q '"version": "1.0.0"' "$D/package.json"; then echo "version did not change"; exit 1; fi
          systemctl is-enabled foundryvtt-discord-bot-update.timer
          # Nothing newer now: a second run is a no-op.
          sudo systemctl start foundryvtt-discord-bot-update.service
          sudo journalctl -u foundryvtt-discord-bot-update --no-pager | tail -n 3 | grep -q 'Up to date'
      - name: Turn auto-update off and on again
        run: |
          sudo ./deploy/linux/install.sh --disable-auto-update
          test ! -f /etc/systemd/system/foundryvtt-discord-bot-update.timer
          if systemctl is-enabled foundryvtt-discord-bot-update.timer; then echo "timer still enabled"; exit 1; fi
          sudo ./deploy/linux/install.sh --enable-auto-update --dir /opt/foundryvtt-discord-integration
      - name: Uninstall
        run: |
          sudo ./deploy/linux/install.sh --uninstall --purge --dir /opt/foundryvtt-discord-integration
          test ! -f /etc/systemd/system/foundryvtt-discord-bot.service
          test ! -f /etc/systemd/system/foundryvtt-discord-bot-update.timer
          test ! -f /etc/systemd/system/foundryvtt-discord-bot-update.service
          test ! -d /opt/foundryvtt-discord-integration
          test ! -d /etc/foundryvtt-discord-integration

  windows-installer:
    name: Windows installer (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Force -Scope CurrentUser }
          $issues = Invoke-ScriptAnalyzer -Path deploy\windows -Recurse
          $issues | ForEach-Object { "::error file=deploy/windows/$($_.ScriptName),line=$($_.Line)::$($_.RuleName): $($_.Message)" }
          if ($issues) { throw "PSScriptAnalyzer found $($issues.Count) issue(s)" }
      - name: Production dependencies for the payload
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Compile the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.0.0 "/DSourceDir=${{ github.workspace }}" deploy\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - name: Install silently
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\FoundryVTT\Data\modules\m1", "$env:LOCALAPPDATA\FoundryVTT\Config" | Out-Null
          Set-Content "$env:LOCALAPPDATA\FoundryVTT\Data\modules\m1\module.json" '{"id":"m1","title":"M1","version":"1.0.0"}'
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=setup.log','/DiscordToken=dummy-token','/ClientId=123456789012345678',"/DataPath=$env:LOCALAPPDATA\FoundryVTT",'/Timezone=Europe/Stockholm','/Interval=20','/AutoUpdate=1' -Wait -PassThru
          Get-Content setup.log | Select-Object -Last 40
          $taskLog = "$env:ProgramData\FoundryVTT Discord integration\install-task.log"
          if (Test-Path $taskLog) { "--- install-task.log ---"; Get-Content $taskLog }
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
      - name: Verify
        shell: pwsh
        run: |
          $envFile = "$env:ProgramData\FoundryVTT Discord integration\.env"
          Get-Content $envFile | ForEach-Object { $_ -replace '^DISCORD_TOKEN=.*', 'DISCORD_TOKEN=***' }
          if (-not (Select-String -Path $envFile -Pattern '^DISCORD_CLIENT_ID=123456789012345678$' -Quiet)) { throw ".env is missing the client id" }
          if (-not (Select-String -Path $envFile -Pattern '^TIMEZONE=Europe/Stockholm$' -Quiet)) { throw ".env is missing the timezone" }
          if (-not (Select-String -Path $envFile -Pattern '^POLL_INTERVAL_SECONDS=20$' -Quiet)) { throw ".env is missing the interval" }
          $task = Get-ScheduledTask -TaskName "FoundryVTT Discord integration"
          "Task state: $($task.State); action: $($task.Actions[0].Execute) $($task.Actions[0].Arguments)"
          if ($task.Actions[0].Arguments -notmatch '--env') { throw "task does not point at the ProgramData .env" }
          $app = "${env:ProgramFiles}\FoundryVTT Discord integration"
          if (-not (Test-Path "$app\node_modules\discord.js")) { throw "node_modules missing from the installed payload" }
          & node "$app\scripts\check-config.js" --env $envFile
          if ($LASTEXITCODE -ne 0) { throw "check-config failed" }
          Stop-ScheduledTask -TaskName "FoundryVTT Discord integration" -ErrorAction SilentlyContinue
      - name: Auto-update to the latest release (Windows PowerShell 5.1)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          try {
            $ErrorActionPreference = "Stop"
            $cfg = "$env:ProgramData\FoundryVTT Discord integration"
            $app = "${env:ProgramFiles}\FoundryVTT Discord integration"
            $upd = Get-ScheduledTask -TaskName "FoundryVTT Discord integration update"
            "Update task: $($upd.Actions[0].Execute) $($upd.Actions[0].Arguments)"
            if ($upd.Actions[0].Arguments -notmatch 'auto-update\.ps1') { throw "update task does not run auto-update.ps1" }
            if ($upd.Principal.UserId -notmatch 'SYSTEM|S-1-5-18') { throw "update task does not run as SYSTEM" }
            Set-Content -Path "$cfg\github-token" -Value $env:GITHUB_TOKEN -NoNewline
            Add-Content -Path "$cfg\.env" -Value "EXTRA_SETTING=kept"
            Set-Content -Path "$cfg\data\marker" -Value "marker"
            $before = (Get-FileHash "$cfg\.env").Hash
            Stop-ScheduledTask -TaskName "FoundryVTT Discord integration" -ErrorAction SilentlyContinue
            & "$app\deploy\windows\auto-update.ps1" -Check
            if ($LASTEXITCODE -ne 0) { Get-Content "$cfg\auto-update.log"; throw "check failed" }
            $acl = (Get-Acl "$cfg\github-token").Access | ForEach-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value }
            "Token file ACL: $($acl -join ', ')"
            if ($acl | Where-Object { $_ -notin 'S-1-5-18', 'S-1-5-32-544' }) { throw "token file is readable by others" }
            & "$app\deploy\windows\auto-update.ps1"
            $code = $LASTEXITCODE
            Get-Content "$cfg\auto-update.log"
            if ($code -ne 0) { throw "auto-update failed" }
            if (Select-String -Path "$cfg\auto-update.log" -SimpleMatch $env:GITHUB_TOKEN -Quiet) { throw "the token was logged" }
            if (-not (Select-String -Path "$cfg\auto-update.log" -Pattern 'Updated to version' -Quiet)) { throw "no update happened" }
            if ((Get-FileHash "$cfg\.env").Hash -ne $before) { throw ".env changed" }
            if (-not (Test-Path "$cfg\data\marker")) { throw "data folder lost" }
            $version = (Get-Content "$app\package.json" -Raw | ConvertFrom-Json).version
            "Installed version now: $version"
            if ($version -eq "1.0.0") { throw "version did not change" }
            if (-not (Get-ScheduledTask -TaskName "FoundryVTT Discord integration update" -ErrorAction SilentlyContinue)) { throw "update task lost by the upgrade" }
            Stop-ScheduledTask -TaskName "FoundryVTT Discord integration" -ErrorAction SilentlyContinue
          } catch {
            $log = "$env:ProgramData\FoundryVTT Discord integration\auto-update.log"
            if (Test-Path $log) { "::notice title=auto-update.log::$((Get-Content $log) -join '%0A')" }
            "::error::$($_.Exception.Message)"
            exit 1
          }
      - name: Uninstall silently
        shell: pwsh
        run: |
          $unins = Get-ChildItem "${env:ProgramFiles}\FoundryVTT Discord integration\unins*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $unins.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/PurgeConfig=1' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Get-ScheduledTask -TaskName "FoundryVTT Discord integration" -ErrorAction SilentlyContinue) { throw "scheduled task still exists" }
          if (Get-ScheduledTask -TaskName "FoundryVTT Discord integration update" -ErrorAction SilentlyContinue) { throw "update task still exists" }
          if (Test-Path "$env:ProgramData\FoundryVTT Discord integration") { throw "config folder still exists" }
          if (Test-Path "${env:ProgramFiles}\FoundryVTT Discord integration\src") { throw "program files still exist" }
