# Release: builds the bot for Linux and Windows and publishes a GitHub Release. The version comes from
# the tag; nobody bumps a version in the code (the build stamps it into the bundles' package.json).
#
# How to release:
#   1. Actions -> Release -> Run workflow (branch main) -> type the version, e.g. 1.2.3 (a leading v is
#      stripped; 1.2.3-rc.1 makes a pre-release). CI runs, every file is built, a draft release v1.2.3 is
#      created with all files attached and published only when everything worked.
#   2. Fallback: publish a release v1.2.3 by hand on GitHub (Releases -> Draft a new release -> tag v1.2.3
#      on main -> Publish). The files are built and attached to it afterwards; its notes are kept.
# Release notes (way 1): the "## [1.2.3]" section of CHANGELOG.md when there is one, otherwise GitHub's
# generated notes. Files: see scripts/build-release.sh and docs/RELEASING.md.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (1.2.3-rc.1 makes a pre-release)"
        required: true
        type: string
  release:
    types: [published]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Work out the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Version, tag and pre-release flag
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          fail() { echo "::error::$*"; exit 1; }
          if [[ $EVENT == workflow_dispatch ]]; then
            VERSION="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
            VERSION="${VERSION#v}"
            [[ $VERSION =~ $semver ]] || fail "'$INPUT_VERSION' is not a version like 1.2.3 or 1.2.3-rc.1."
            [[ $REF == "refs/heads/$DEFAULT_BRANCH" ]] || fail "Run the release from the default branch ($DEFAULT_BRANCH), not $REF."
            TAG="v$VERSION"
            if out="$(gh api "repos/$REPO/git/ref/tags/$TAG" 2>&1)"; then
              fail "The tag $TAG already exists. Pick a new version."
            elif ! grep -q 'HTTP 404' <<<"$out"; then
              fail "Could not check whether the tag $TAG exists: $out"
            fi
            # Published releases (drafts are checked again by the publish job, which can see them).
            n="$(gh api --paginate "repos/$REPO/releases" | jq -s --arg t "$TAG" '[add[] | select(.tag_name == $t or .name == $t)] | length')"
            [[ $n == 0 ]] || fail "A release named $TAG already exists."
            if [[ $VERSION == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          else
            TAG="$RELEASE_TAG"
            [[ $TAG == v* && ${TAG#v} =~ $semver ]] || fail "The release tag '$TAG' must look like v1.2.3 (or v1.2.3-rc.1)."
            VERSION="${TAG#v}"
            if [[ $RELEASE_PRERELEASE == true ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION, pre-release: $PRERELEASE) from $EVENT"

  ci:
    name: CI
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] the same commit's CI, as the release standard asks

  build:
    name: Build the archives
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in a release job: a poisoned cache could end up in the published bundles.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build the Linux and Windows archives (version stamped from the tag)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/build-release.sh build dist "$VERSION"

      - name: Keep the archives for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Keep the Windows payload for the setup job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-payload
          path: dist/payload/windows/foundryvtt-discord-integration-${{ needs.prepare.outputs.version }}
          include-hidden-files: true
          if-no-files-found: error

  setup:
    name: Build the Windows setup.exe
    needs: [prepare, build]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the Windows payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-payload
          path: payload

      - name: Compile with Inno Setup
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "/DSourceDir=$env:GITHUB_WORKSPACE\payload" deploy\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Keep the setup.exe for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup
          path: dist/foundryvtt-discord-integration-${{ needs.prepare.outputs.version }}-setup.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [prepare, ci, build, setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and attach the files
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archives
          path: dist

      - name: Fetch the setup.exe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: setup
          path: dist

      - name: Fixed names, legacy files and SHA256SUMS.txt
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          scripts/build-release.sh finalize dist "$VERSION"
          cat dist/SHA256SUMS.txt

      - name: Release notes
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # The "## [X.Y.Z]" section of CHANGELOG.md, without its link reference lines.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[.*\]: http/ { print }
          ' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            echo "Notes from the CHANGELOG.md section [$VERSION]."
          else
            gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body > notes.md
            echo "No CHANGELOG.md section [$VERSION]; using GitHub's generated notes."
          fi
          cat notes.md

      - name: Create the draft release, attach everything, publish it
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Checked again here: this job can also see draft releases, and time has passed since prepare.
          if out="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" 2>&1)"; then
            echo "::error::The tag $TAG appeared while the release was being built; nothing was published."; exit 1
          elif ! grep -q 'HTTP 404' <<<"$out"; then
            echo "::error::Could not check the tag $TAG: $out"; exit 1
          fi
          n="$(gh api --paginate "repos/$GH_REPO/releases" | jq -s --arg t "$TAG" '[add[] | select(.tag_name == $t or .name == $t)] | length')"
          if [[ $n != 0 ]]; then
            echo "::error::A release (or draft) named $TAG already exists; delete the draft or pick a new version."; exit 1
          fi
          mapfile -t files < <(sed 's|^|dist/|' dist/release-files.txt)
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md "${files[@]}"
          if [[ $PRERELEASE == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi

      - name: Attach everything to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(sed 's|^|dist/|' dist/release-files.txt)
          gh release upload "$TAG" --clobber "${files[@]}"

      - name: Summary
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "## Release $TAG"
            echo
            echo "https://github.com/$GH_REPO/releases/tag/$TAG (pre-release: $PRERELEASE, from $EVENT)"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
