# Builds and publishes the bot whenever a version tag (v1.2.3) is pushed, a
# GitHub Release with such a tag is published (publishing a release creates the
# tag, which also triggers this workflow), or the workflow is run by hand from
# the Actions tab with the tag to create.
#
# How to release a new version:
#   1. Update CHANGELOG.md (a "## [1.2.3]" section) and push your changes.
#   2. Either push a tag:   git tag v1.2.3 && git push origin v1.2.3
#      or on GitHub: Releases -> "Draft a new release" -> create tag v1.2.3 -> Publish,
#      or Actions -> "Release bot" -> "Run workflow" -> enter v1.2.3.
#   3. This workflow runs the tests, creates the release if it does not exist yet
#      (notes taken from the CHANGELOG.md section), and attaches:
#        foundryvtt-discord-integration-<version>-linux.tar.gz   bundle + interactive installer
#        install.sh                                               the Linux installer alone (curl | sudo bash)
#        foundryvtt-discord-integration-<version>-windows.zip     bundle + Task Scheduler scripts
#        foundryvtt-discord-integration-<version>-setup.exe       Windows installer (Inno Setup)
#
# The version number in package.json is taken from the tag.
# See docs/RELEASING.md for the full procedure.

name: Release bot

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v1.0.1 (created on the chosen branch if it does not exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and attach the bundles
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in a release job: a poisoned cache could end up in the published bundles.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Work out version
        id: meta
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW_TAG"
          # Strict check: the tag ends up in file names, release names and later steps.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' must look like v1.2.3 (optionally v1.2.3-beta.1)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "name=foundryvtt-discord-integration-${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          npm ci
          npm test

      - name: Stamp version into package.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cat package.json | head -5

      - name: Install production dependencies only
        run: |
          rm -rf node_modules
          npm ci --omit=dev --no-audit --no-fund

      - name: Build bundles
        env:
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          COMMON=(src scripts docs node_modules package.json package-lock.json README.md LICENSE CHANGELOG.md .env.example)
          rm -rf dist && mkdir -p "dist/linux/$NAME" "dist/windows/$NAME"

          cp -R "${COMMON[@]}" "dist/linux/$NAME/"
          mkdir -p "dist/linux/$NAME/deploy" && cp -R deploy/linux "dist/linux/$NAME/deploy/"
          tar -C dist/linux -czf "dist/$NAME-linux.tar.gz" "$NAME"

          cp -R "${COMMON[@]}" "dist/windows/$NAME/"
          mkdir -p "dist/windows/$NAME/deploy" && cp -R deploy/windows "dist/windows/$NAME/deploy/"
          (cd dist/windows && zip -qr "../$NAME-windows.zip" "$NAME")

          cp deploy/linux/install.sh dist/install.sh
          ls -la dist/*.tar.gz dist/*.zip dist/install.sh
          sha256sum dist/*.tar.gz dist/*.zip dist/install.sh > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Keep the Windows payload for the installer job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-payload
          path: dist/windows/${{ steps.meta.outputs.name }}
          include-hidden-files: true
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on && !/^\[.*\]: http/ { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          [ -s dist/RELEASE_NOTES.md ] || echo "Release ${TAG}." > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md
          # Only set the notes when this workflow creates the release; a release
          # published by hand keeps the notes written on GitHub.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "body_path=" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=dist/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release (if needed) and attach the bundles
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/SHA256SUMS.txt

  installer:
    name: Windows installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # attach the installer to the release
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the Windows payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-payload
          path: payload

      - name: Compile with Inno Setup
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" "/DSourceDir=$env:GITHUB_WORKSPACE\payload" deploy\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist\*-setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist\SHA256SUMS-setup.txt
          Get-Content dist\SHA256SUMS-setup.txt

      - name: Attach the installer to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: |
            dist/*-setup.exe
            dist/SHA256SUMS-setup.txt
