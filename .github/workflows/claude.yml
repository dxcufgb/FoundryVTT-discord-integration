# Claude code review, authenticated with the Claude subscription token in the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (created with `claude setup-token`).
#
#   - review:  every pull request that is opened, updated, reopened or marked ready for review
#              gets an automatic review: inline comments on problems, or one summary comment.
#              Drafts, bot-opened PRs (Dependabot, Renovate) and PRs from forks are skipped.
#              The review plugin skips a PR that Claude has already commented on, so after
#              pushing more commits ask for a fresh one with "@claude review".
#              Project rules for the reviewer are in CLAUDE.md.
#   - respond: mention @claude in a PR or issue comment (or a PR review comment) to ask a
#              question or request a change. Only users with write access can trigger it.

name: Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # zizmor flags issue_comment as dangerous because it runs with secrets on any comment. Here the respond job
  # only reacts to "@claude", claude-code-action refuses commenters without write access, and the checkout is
  # the default branch without persisted credentials, so no untrusted code runs with the token.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  review:
    name: Review
    # Skips drafts, PRs opened by bots (Dependabot, Renovate, apps: the action refuses bot-triggered runs) and PRs
    # from forks (they get no secrets, so the review could only fail; ask "@claude review" on those instead).
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # the action exchanges it for a Claude GitHub App token to post comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1.0.258
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

  respond:
    name: Respond to @claude
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the action exchanges it for a Claude GitHub App token
      actions: read # lets Claude read CI results on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1.0.258
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Turns on the CI tools (run status, job logs); the job permission above alone is not enough.
          additional_permissions: |
            actions: read
