# The Claude review. Identical in every dxcufgb repository; the jobs live in dxcufgb/foundry-module-ci
# (.github/workflows/claude-reusable.yml, which explains them). Needs the repository secret
# CLAUDE_CODE_OAUTH_TOKEN (created with `claude setup-token`).
#   - every pull request gets an automatic review (drafts, bot-opened PRs and PRs from forks are skipped);
#     ask for a fresh one with "@claude review".
#   - mention @claude in a PR or issue comment to ask a question or request a change. Only the owner, members
#     and collaborators start it, never bots.

name: Claude

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # zizmor flags issue_comment as dangerous because it runs with secrets on any comment. Here it runs the
  # default branch's workflow, the respond job only reacts to "@claude" from the owner, members and
  # collaborators, and claude-code-action refuses commenters without write access, so only people who can
  # already push to the repository start it with the token.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    # The most any job in the shared workflow needs; each job there asks for less.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: dxcufgb/foundry-module-ci/.github/workflows/claude-reusable.yml@41ae9dd67c16b5540248c6c5dc06d6442eb93814 # v1.3.1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
