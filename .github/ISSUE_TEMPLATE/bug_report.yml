name: Bug report
description: The bot does not behave as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: bot-version
    attributes:
      label: Bot version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
      placeholder: "13.348"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, Other]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version (`node --version`)
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Remove your bot token and any other secrets before pasting.
      render: text
